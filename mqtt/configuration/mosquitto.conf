# Mosquitto MQTT broker configuration for the IoT Monitoring System.
# For this demo/academic setup, anonymous connections are allowed on the
# internal Docker network. For production, set allow_anonymous false and
# configure password_file / TLS.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
